<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.2.3/css/flag-icons.min.css">
<style>
  body { margin: 0; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(var(--rot)); }
    50% { transform: translateY(-22px) rotate(var(--rot)); }
  }
  .fi { background-size: cover; background-position: center; display: inline-block; }
</style>
</helmet>
<div style="position:relative; width:100%; height:1100px; overflow:hidden; background: linear-gradient(160deg, oklch(0.96 0.01 240), oklch(0.9 0.02 260)); font-family: Helvetica, Arial, sans-serif;">
  <sc-for list="{{ flags }}" as="f" hint-placeholder-count="20">
    <span class="fi fi-{{ f.code }}" style="{{ f.style }}"></span>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const codes = [
      { code: 'jp' }, { code: 'es' }, { code: 'sa' }, { code: 'br' }, { code: 'ro' },
      { code: 'vn' }, { code: 'ru' }, { code: 'tr' }, { code: 'gb' }, { code: 'de' },
      { code: 'ar' }, { code: 'cn' }, { code: 'hk' }, { code: 'kr' }, { code: 'fr' },
      { code: 'in' }, { code: 'pk' }, { code: 'et' }, { code: 'ke' }, { code: 'ua' },
    ];
    const clips = {
      circle: 'circle(50% at 50% 50%)',
      square: 'none',
      rect: 'none',
      triangle: 'polygon(50% 0%, 0% 100%, 100% 100%)',
      diamond: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)',
      hexagon: 'polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)',
      pentagon: 'polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%)',
      star: 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)',
    };
    const shapeCycle = ['circle', 'star', 'square', 'triangle', 'diamond', 'hexagon', 'rect', 'pentagon'];
    // hand-placed scattered positions (top%, left%) and sizes/rotation/duration/delay for a bubble-field feel
    const layout = [
      [4, 6, 110], [10, 32, 90], [2, 58, 130], [8, 80, 100], [22, 14, 80],
      [28, 46, 150], [18, 66, 95], [32, 88, 110], [42, 4, 105], [46, 26, 140],
      [38, 58, 90], [50, 78, 120], [58, 10, 100], [62, 36, 160], [55, 60, 85],
      [66, 84, 110], [74, 20, 95], [80, 48, 130], [72, 70, 100], [86, 90, 90],
    ];
    const flags = codes.map((c, i) => {
      const shapeKey = shapeCycle[i % shapeCycle.length];
      const [top, left, size] = layout[i];
      const isRect = shapeKey === 'rect';
      const w = isRect ? size * 1.5 : size;
      const h = isRect ? size * 0.85 : size;
      const rot = ((i * 37) % 40) - 20;
      const dur = 5 + (i % 5);
      const delay = -(i * 0.6);
      const radius = (shapeKey === 'square' || shapeKey === 'rect') ? '10px' : '0px';
      const style = `position:absolute; top:${top}%; left:${left}%; width:${w}px; height:${h}px; clip-path:${clips[shapeKey]}; border-radius:${radius}; --rot:${rot}deg; animation: floaty ${dur}s ease-in-out infinite; animation-delay:${delay}s; box-shadow: 0 8px 24px oklch(0 0 0 / 0.15); transform: rotate(${rot}deg);`;
      return { code: c.code, style };
    });
    return { flags };
  }
}
</script>
</body>
</html>
