}">
class Component extends DCLogic {
  renderVals() {
    return {
      goatBg: this.props.goatBg ?? 'oklch(0.94 0.03 70)',
      goatInk: this.props.goatInk ?? 'oklch(0.22 0.02 60)',
      goatAccent: this.props.goatAccent ?? 'oklch(0.55 0.16 35)',
      goatBg2: this.props.goatBg2 ?? 'oklch(0.88 0.05 65)',
      goatMuzzle: this.props.goatMuzzle ?? 'oklch(0.93 0.02 70)',
      goatName: this.props.goatName ?? 'BLAZE',
      fernBg: this.props.fernBg ?? 'oklch(0.16 0.01 260)',
      fernA: this.props.fernA ?? 'oklch(0.72 0.19 200)',
      fernB: this.props.fernB ?? 'oklch(0.62 0.24 340)',

    };

}
